<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <title>Buscando la propiedad | Ibarra Propiedades</title>
    <link href="/assets/img/favicon/favicon.ico" rel="icon" />
    <style>
      body {
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        align-items: center;
        justify-content: center;
        background: #de223a;
        color: #ffffff;
        font-family: "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      a {
        color: #ffffff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- Mantiene vivos los links viejos (detalle-propiedad.html?id=...) -->
    <main>
      <h1 id="titulo">Buscando la propiedad...</h1>
      <p id="texto"><a href="/propiedades.html">Ver todas las propiedades</a></p>
    </main>
    <script>
      (function () {
        var id = new URLSearchParams(window.location.search).get("id");

        function notFound() {
          document.getElementById("titulo").textContent =
            "Esta propiedad ya no está disponible";
        }

        if (!id) {
          window.location.replace("/propiedades.html");
          return;
        }

        fetch("/data/propiedades.json")
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            var match = data.properties.find(function (property) {
              return String(property.id) === id || property.ref === id;
            });
            if (match) window.location.replace(match.url);
            else notFound();
          })
          .catch(notFound);
      })();
    </script>
  </body>
</html>
